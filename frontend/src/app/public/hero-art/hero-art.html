<div class="hero-art" aria-hidden="true">
  <div class="stage">
    <svg viewBox="0 0 440 440" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="acBody" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff" />
          <stop offset="1" style="stop-color: var(--theme-gray-100)" />
        </linearGradient>
        <linearGradient id="appl" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" style="stop-color: var(--theme-white)" />
          <stop offset="1" style="stop-color: var(--theme-gray-100)" />
        </linearGradient>
        <linearGradient id="cool" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" style="stop-color: var(--theme-primary-light)" />
          <stop offset="1" style="stop-color: var(--theme-primary-300)" />
        </linearGradient>
        <radialGradient id="glass" cx="0.35" cy="0.35" r="0.7">
          <stop offset="0" style="stop-color: var(--theme-primary-100)" />
          <stop offset="1" style="stop-color: var(--theme-primary)" />
        </radialGradient>
        <clipPath id="drumClip"><circle cx="65" cy="86" r="34" /></clipPath>
      </defs>

      <!-- Split AC unit -->
      <g transform="translate(70 52)">
        <rect width="300" height="86" rx="20" fill="url(#acBody)" />
        <rect x="0" y="58" width="300" height="28" rx="14" style="fill: var(--theme-gray-200)" />
        <g class="ac-flap">
          <rect x="24" y="66" width="252" height="6" rx="3" style="fill: var(--theme-gray-300)" />
        </g>
        <circle class="led" cx="262" cy="26" r="6" style="fill: var(--theme-success-light)" />
        <rect x="24" y="20" width="90" height="10" rx="5" style="fill: var(--theme-gray-100)" />
        <rect x="24" y="36" width="54" height="8" rx="4" style="fill: var(--theme-gray-100)" />
        <text
          x="186"
          y="35"
          font-family="Plus Jakarta Sans, sans-serif"
          font-size="20"
          font-weight="800"
          style="fill: var(--theme-primary)"
        >
          {{ temp() }}°C
        </text>
      </g>

      <!-- Cool airflow -->
      <g
        class="airflow"
        fill="none"
        stroke="url(#cool)"
        stroke-width="4"
        stroke-linecap="round"
        opacity="0.9"
      >
        <path d="M110 160 C 120 190, 95 210, 110 240" />
        <path d="M170 160 C 180 195, 155 215, 170 252" />
        <path d="M230 160 C 240 195, 215 215, 230 252" />
        <path d="M290 160 C 300 190, 275 210, 290 240" />
      </g>

      <!-- Falling frost -->
      <g class="snow" style="fill: var(--theme-primary-50)">
        <circle cx="120" cy="170" r="3" />
        <circle cx="200" cy="175" r="2.5" />
        <circle cx="260" cy="168" r="3" />
        <circle cx="320" cy="172" r="2" />
        <circle cx="150" cy="180" r="2" />
      </g>

      <!-- Fridge -->
      <g transform="translate(78 226)">
        <rect width="110" height="160" rx="16" fill="url(#appl)" />
        <g class="fridge-door">
          <rect width="110" height="56" rx="16" fill="url(#appl)" />
          <rect x="88" y="16" width="6" height="26" rx="3" style="fill: var(--theme-gray-400)" />
          <rect x="14" y="16" width="34" height="8" rx="4" style="fill: var(--theme-gray-200)" />
        </g>
        <rect x="0" y="56" width="110" height="4" style="fill: var(--theme-gray-300)" />
        <rect x="88" y="76" width="6" height="40" rx="3" style="fill: var(--theme-gray-400)" />
        <!-- temperature badge -->
        <rect
          x="14"
          y="76"
          width="44"
          height="20"
          rx="6"
          style="fill: var(--theme-cat-fridge)"
          opacity="0.9"
        />
        <text
          x="20"
          y="90"
          font-family="Plus Jakarta Sans, sans-serif"
          font-size="11"
          font-weight="800"
          style="fill: var(--theme-primary-50)"
        >
          4°C
        </text>
      </g>

      <!-- Washing machine -->
      <g transform="translate(232 246)">
        <rect width="130" height="140" rx="18" fill="url(#appl)" />
        <rect x="0" y="0" width="130" height="30" rx="16" style="fill: var(--theme-gray-200)" />
        <circle class="blink-a" cx="22" cy="15" r="5" style="fill: var(--theme-primary-light)" />
        <circle class="blink-b" cx="40" cy="15" r="5" style="fill: var(--theme-primary-300)" />
        <rect x="80" y="10" width="36" height="10" rx="5" style="fill: var(--theme-gray-300)" />
        <rect
          x="80"
          y="10"
          width="36"
          height="10"
          rx="5"
          style="fill: var(--theme-success-light)"
          class="wash-progress"
        />
        <circle cx="65" cy="86" r="42" style="fill: var(--theme-gray-300)" />
        <circle cx="65" cy="86" r="34" fill="url(#glass)" />
        <g clip-path="url(#drumClip)">
          <path
            class="water"
            d="M20 96 Q 42 88 65 96 T 110 96 V 130 H 20 Z"
            style="fill: var(--theme-primary-300)"
            opacity="0.6"
          />
          <g class="drum">
            <path d="M44 92 Q 65 70 86 92 Q 65 108 44 92 Z" fill="#ffffff" opacity="0.55" />
            <circle cx="78" cy="74" r="5" fill="#ffffff" opacity="0.7" />
          </g>
          <g class="bubbles" fill="#ffffff">
            <circle cx="52" cy="112" r="3" opacity="0.8" />
            <circle cx="70" cy="116" r="2.2" opacity="0.7" />
            <circle cx="84" cy="110" r="2.6" opacity="0.8" />
          </g>
        </g>
      </g>

      <!-- Road + service van -->
      <rect x="20" y="404" width="400" height="3" rx="1.5" fill="#ffffff" opacity="0.15" />
      <g class="van">
        <g transform="translate(0 378)">
          <rect x="0" y="4" width="46" height="20" rx="5" style="fill: var(--theme-accent)" />
          <path d="M46 8 h10 l8 9 v7 h-18 z" style="fill: var(--theme-accent)" />
          <rect
            x="49"
            y="10"
            width="8"
            height="6"
            rx="1.5"
            style="fill: var(--theme-primary-100)"
          />
          <rect x="6" y="10" width="20" height="4" rx="2" style="fill: var(--theme-primary-50)" />
          <circle cx="12" cy="25" r="5" style="fill: var(--theme-text)" />
          <circle cx="52" cy="25" r="5" style="fill: var(--theme-text)" />
          <circle cx="12" cy="25" r="2" style="fill: var(--theme-gray-300)" />
          <circle cx="52" cy="25" r="2" style="fill: var(--theme-gray-300)" />
        </g>
      </g>

      <!-- Sparkles -->
      <g fill="#ffffff">
        <path class="twinkle" d="M384 200 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" />
        <path class="twinkle t2" d="M40 190 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" />
        <path class="twinkle t3" d="M396 330 l3 6 6 3 -6 3 -3 6 -3 -6 -6 -3 6 -3z" />
      </g>
    </svg>
  </div>

  <!-- Live booking status (cycles through the journey) -->
  <div class="float-card fc-1 live-card" [attr.data-tone]="stage().tone">
    @for (s of [stage()]; track s.title) {
      <span class="fc-icon swap"><app-icon [name]="s.icon" [size]="18" /></span>
      <span class="swap">
        <b>{{ s.title }}</b><small>{{ s.sub }}</small>
        <span class="journey-dots">
          @for (j of journey; track $index) {
            <i [class.on]="$index <= step()"></i>
          }
        </span>
      </span>
    }
  </div>

  <!-- Technician ETA countdown -->
  <div class="float-card fc-2">
    <span class="fc-icon"><app-icon name="tool" [size]="18" /></span>
    <span
      ><b>Technician on the way</b
      ><small
        >Arriving in <span class="eta">{{ eta() }} mins</span></small
      ></span
    >
  </div>

  <!-- WhatsApp updates -->
  <div class="float-card fc-3">
    <span class="fc-icon"><app-icon name="whatsapp" [size]="18" /></span>
    @for (m of [waMsg()]; track m) {
      <span class="swap"
        ><b>WhatsApp update</b><small>{{ m }}</small></span
      >
    }
    <span class="wa-count">{{ waCount() }}</span>
  </div>
</div>
